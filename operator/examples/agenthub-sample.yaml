# Example AgentHub custom resource.
#
# Install the operator first (helm install ... ./operator/deploy/agenthub-operator),
# then apply THIS file. The operator reconciles it into a running agenthub
# deployment. The AgentHub must live in the SAME namespace the operator watches
# (the operator's release namespace).
#
# IMPORTANT: the inline secret values below are for illustration only. In any
# real deployment replace them with existingSecret references to Secrets you
# create out-of-band (see README "External PostgreSQL" and "Production").
apiVersion: agenthub.ai/v1alpha1
kind: AgentHub
metadata:
  name: agenthub
  namespace: agenthub-operator
spec:
  image:
    repository: agenthub
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1            # keep 1 until the schema is migrated; see README "Multi-replica"
  env: dev
  httpPort: 3500
  staticDir: /app/backend/static

  # --- External PostgreSQL (mandatory) ---
  database:
    url: "postgres://agenthub:changeme@postgres:5432/agenthub?sslmode=disable"
    # Production alternative — never put the DSN in the CR:
    # existingSecret: agenthub-db
    # secretKey: DATABASE_URL

  # --- Bootstrap administrator ---
  bootstrapAdmin:
    email: admin@example.com
    name: Administrator
    password: change-me-in-prod
    # existingSecret: agenthub-bootstrap
    # secretKey: BOOTSTRAP_ADMIN_PASSWORD

  # --- At-rest encryption key (>=32 bytes; prod requires it) ---
  encryptionKey:
    value: "this-is-a-32-byte-or-longer-secret-key-example"
    # existingSecret: agenthub-keys
    # key: ENCRYPTION_KEY

  # --- OAuth providers (empty IDs simply hide the button) ---
  oauth:
    enabled: true
    google:
      clientID: ""
      clientSecret: ""
    github:
      clientID: ""
      clientSecret: ""
    oidc:
      issuer: ""
      clientID: ""
      clientSecret: ""

  seedDemo: false
  pushEnabled: true

  # --- Row level security ---
  # enforce is the server default; it is written out so the CR states what it
  # wants. Switching it off makes every per-owner policy a no-op, so with
  # env=prod the controller refuses the spec unless rlsAck is true as well.
  rls: enforce
  # rls: off
  # rlsAck: true
  #
  # The DDL role: a schema owner, distinct from the runtime role. When it is
  # unset the migrations run as the runtime role, which is weaker (the role can
  # then alter its own tables and turn a policy off).
  # migrateDatabaseURL:
  #   existingSecret: agenthub-migrate-db
  #   secretKey: MIGRATE_DATABASE_URL
  #
  # Break-glass bearer token. Prefer an existingSecret over an inline value.
  # adminToken:
  #   existingSecret: agenthub-admin
  #   key: ADMIN_TOKEN

  # --- Audit trail ---
  audit:
    enabled: true
    retention: 2160h        # 90 days
    queue: 1024
    batch: 128

  # --- Execution control plane (off unless asked for) ---
  sandbox:
    enabled: false
    provider: docker
    defaultImage: debian:bookworm-slim
    idleTTL: 10m
    maxTTL: 1h
    maxPerOwner: 2
    maxTotal: 8
    # egressAllowlist is recorded but NOT enforced yet: no provider filters
    # egress hosts, so the server warns at boot and reads the allowlist mode as
    # "no network". Leave it unset unless you are tracking that TODO.

  # --- Router layer (trigger intake and delegation) ---
  router:
    enabled: true
    interval: 15s
    maxTickets: 4           # must fit inside sandbox.maxTotal
    assessMode: rules

  # --- Optional database checkpoints (mounts a backup PVC) ---
  persistence:
    enabled: false
    size: 10Gi
    # storageClass: standard
