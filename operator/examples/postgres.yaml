# postgres.yaml — minimal in-cluster PostgreSQL for a local kind/k3d walkthrough.
#
# The agenthub-operator expects an *external* database (it never provisions one),
# but "external" only means "not reconciled by the operator". A plain Postgres
# workload in the operator namespace is reachable via in-cluster DNS and is enough
# for a local smoke test. For anything beyond a demo, prefer the Bitnami chart
# (see operator/README.md "Local cluster walkthrough") or your own managed PG.
apiVersion: v1
kind: Namespace
metadata:
  name: agenthub-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agenthub-operator
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Listen on 5432 so the whole in-cluster chain (app -> Service -> pod)
          # is 5432. The official image prepends "postgres" to args beginning with
          # "-", so "-c port=5432" runs as "postgres -c port=5432".
          args: [ "-c", "port=5432" ]
          env:
            - { name: POSTGRES_USER, value: agenthub }
            - { name: POSTGRES_PASSWORD, value: agenthub }
            - { name: POSTGRES_DB, value: agenthub }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec:
              command: [ pg_isready, -U, agenthub, -p, "5432" ]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agenthub-operator
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
