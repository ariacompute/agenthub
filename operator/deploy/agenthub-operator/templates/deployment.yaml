apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenthub-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agenthub-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "agenthub-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agenthub-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agenthub-operator.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            # The operator only manages resources in its own namespace.
            - name: WATCH_NAMESPACE
              value: "{{ .Release.Namespace }}"
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
