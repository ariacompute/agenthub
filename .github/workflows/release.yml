name: Release

# Publish an agenthub release. Two jobs, independent and in parallel:
#
#   build-and-publish  the container image on DockerHub (unchanged)
#   desktop            Windows / macOS / Linux desktop builds as release assets
#
# Image:
#
#   ariacompute/agenthub-agenthub:<release tag>   pinned to that release
#   ariacompute/agenthub-agenthub:latest          whatever was released last
#
# The release tag is both the image tag and the VERSION build-arg, so the image
# tag always equals what /healthz reports and what the console renders in the
# bottom-left corner as "version@commit". Nothing here falls back to the
# Dockerfile defaults: publishing without a tag would otherwise push an
# untraceable :latest stamped with the "dev" sentinel.
#
# The other three stamp args come from the checkout of that tag: COMMIT is the
# seven character revision, DISTANCE is how far HEAD sits after the tag (0 for a
# release), DIRTY is false because CI always builds from a clean checkout. They
# are the same four args `make docker-build` / `make compose-build` pass locally;
# .git is excluded by .dockerignore, so this checkout is the only source for them.
#
# The image needs no proxy here: the Dockerfile already retries `bun install` and
# `go mod download` with the proxy variables cleared, which on a runner with
# direct internet is the first thing that works.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   - DOCKERHUB_USERNAME: DockerHub account / org name
#   - DOCKERHUB_TOKEN:    DockerHub access token with write permission
#
# Desktop: each matrix cell builds one platform/architecture and attaches a
# native installer (attached by tauri-action) plus a portable archive and a
# SHA256SUMS.txt covering both (attached by action-gh-release). The builds are
# not code-signed — no certificate secrets are configured — so every asset name
# and the release notes say so; see README "Desktop" for how to open an
# unsigned build on macOS and Windows.
on:
  release:
    types: [published]

# One publish at a time: a newer release cancels an in-progress one, so :latest
# can never be overwritten by an older release that happens to finish later,
# and a release's assets are never a mix of two runs. The group used to be
# named after the image alone; it now guards the desktop builds too.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & publish agenthub image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          # The default release checkout does not have to sit on the tag; pinning
          # the ref is what makes COMMIT the revision actually released.
          ref: ${{ github.event.release.tag_name }}
          # Full history so `git rev-list` can measure the distance to the tag.
          fetch-depth: 0

      - name: Resolve build stamp
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::Release carries no tag; refusing to publish an image that cannot be traced back to a release." >&2
            exit 1
          fi
          if [ ! -f ./Dockerfile ]; then
            echo "::error::./Dockerfile is missing at the repository root." >&2
            exit 1
          fi

          COMMIT="$(git rev-parse --short=7 HEAD)"
          # 0 when HEAD is exactly the tag; non-zero only for a release cut from
          # a commit the tag does not point at.
          DISTANCE="$(git rev-list --count "${TAG}..HEAD" 2>/dev/null || echo 0)"

          {
            echo "tag=${TAG}"
            echo "commit=${COMMIT}"
            echo "distance=${DISTANCE}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (commit ${COMMIT}, distance ${DISTANCE})"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the agenthub image
        uses: docker/build-push-action@v6
        with:
          # The console bundle, cmd/, internal/ and migrations/ are copied from
          # the repository root, so the context is "." and not a subdirectory.
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Names must match the ARGs in Dockerfile exactly, otherwise the binary
          # silently keeps the dev / unknown sentinels.
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DISTANCE=${{ steps.meta.outputs.distance }}
            DIRTY=false
          push: true
          tags: |
            ariacompute/agenthub-agenthub:${{ steps.meta.outputs.tag }}
            ariacompute/agenthub-agenthub:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

  # ---------------------------------------------------------------- desktop --
  #
  # The desktop shell is a GUI with no backend: it embeds the console bundle and
  # talks to whichever agenthub server the user points it at. Every cell of the
  # matrix is one platform/architecture pair and publishes:
  #
  #   a native installer   .msi (Windows) / .dmg (macOS) / .deb (Linux)
  #   a portable archive   .zip (Windows) / .tar.gz (macOS, Linux)
  #   SHA256SUMS.txt       covering both, written next to the archive
  #
  # Linux builds no AppImage: the portable .tar.gz already covers "unpack and
  # run", and shipping two ways to do the same thing on top of the .deb just
  # adds an asset nobody checksums.
  #
  # macOS is one cell: arm64, built natively on macos-latest. An x64 cell used
  # to sit next to it on the macos-13 label, but GitHub retired that runner —
  # the job was accepted, then waited for a runner that never picks it up, and
  # the whole release stayed unfinished. Apple Silicon is where the runners
  # are; Intel Macs build from source with `make desktop-build`.
  desktop:
    name: Desktop ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      # Attaching assets to the published release needs write. The image job
      # above deliberately keeps contents: read.
      contents: write

    strategy:
      # One platform failing must not hide the other two from the release.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: ''
            args: --bundles deb
          # `app` is what writes bundle/macos/agenthub.app, and that .app is what
          # the portable .tar.gz packs; `dmg` on its own only produces the disk
          # image and leaves no .app behind for the packaging step to find.
          - os: macos-latest
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: ''
            args: --bundles msi

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve the release stamp
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::Release carries no tag; refusing to publish desktop builds that cannot be traced back to a release." >&2
            exit 1
          fi
          # The tag carries the "v" prefix; Cargo and tauri.conf.json want the
          # bare version, so "installer version === release tag" still holds.
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse --short=7 HEAD)"
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
          } >> "$GITHUB_OUTPUT"
          echo "Building desktop ${VERSION} (commit ${COMMIT})"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Empty for the native cells; the macOS cells add their own triple.
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install the shell's JavaScript tooling
        working-directory: desktop
        run: bun install

      # The version has to be written before cargo runs: it is both the package
      # version and what the installer reports.
      - name: Stamp the release version
        working-directory: desktop
        shell: bash
        run: bun run stamp "${{ steps.meta.outputs.version }}"

      # The console is embedded by rust-embed at compile time, so it must exist
      # before `tauri build`. Same two commands as `make web-build`.
      - name: Build the console
        working-directory: web
        shell: bash
        run: |
          bun install
          bun run build
          test -f ../backend/static/index.html

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by option_env! in src-tauri/src/lib.rs, so "About" reports the
          # revision this build came from.
          AGENTHUB_COMMIT: ${{ steps.meta.outputs.commit }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          # Attach to the release that triggered this run. Without this the
          # action would create a second release of its own.
          releaseId: ${{ github.event.release.id }}
          # There is no updater plugin, so there is nothing to feed a
          # latest.json.
          uploadUpdaterJson: false

      # tauri-action attaches every bundle it finds, and on macOS that list
      # always contains bundle/macos/<name>.app.tar.gz — the archive the
      # updater would consume. There is no updater, and the portable archive
      # packaged below holds the very same .app under the release's own name,
      # with a checksum beside it. Dropping the duplicate keeps the release
      # down to one macOS asset per shape; the action has no input to exclude
      # it, so it is removed after the upload.
      - name: Drop the updater's app archive (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${{ github.event.release.id }}/assets?per_page=100" \
            --jq '.[] | select((.name | endswith(".app.tar.gz")) or (.name | endswith(".app.tar.gz.sig"))) | "\(.id) \(.name)"' \
            | while read -r id name; do
                echo "removing ${name} from the release"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
              done

      - name: Package the portable archive (Linux, macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Where the build lands is the tauri CLI's business: `--target <triple>`
          # puts it under target/<triple>/release, a native build under
          # target/release, and which bundle kinds exist decides what sits in
          # `bundle/`. Look the artefact up instead of reconstructing the path —
          # a guessed path is what broke the aarch64 cell.
          TARGET_ROOT="${GITHUB_WORKSPACE}/desktop/src-tauri/target"
          OUT="${GITHUB_WORKSPACE}/desktop-artifacts"
          mkdir -p "$OUT"
          NAME="agenthub-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            # `| head -1` can close the pipe early and SIGPIPE find; with
            # pipefail that would fail the step for a reason that has nothing to
            # do with the build, so the pipeline's status is not what decides.
            APP="$(find "$TARGET_ROOT" -maxdepth 6 -type d -name '*.app' | head -1 || true)"
            if [ -z "$APP" ]; then
              echo "::error::no app bundle under $TARGET_ROOT — is 'app' in --bundles?" >&2
              find "$TARGET_ROOT" -path '*/bundle/*' -maxdepth 6 | sort | head -40 >&2
              exit 1
            fi
            tar -czf "$OUT/${NAME}.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
          else
            # The binary is named after the cargo package, not the product name;
            # anything executable without an extension is it.
            BIN="$(find "$TARGET_ROOT" -maxdepth 5 -type f -name 'agenthub*' \
              ! -name '*.*' -perm -u+x | head -1 || true)"
            if [ -z "$BIN" ]; then
              echo "::error::no desktop binary under $TARGET_ROOT" >&2
              find "$TARGET_ROOT" -maxdepth 5 | sort | head -40 >&2
              exit 1
            fi
            tar -czf "$OUT/${NAME}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi
          ls -l "$OUT"

      - name: Package the portable archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $out = "$env:GITHUB_WORKSPACE/desktop-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Recurse for the same reason as the Unix step: never assume which
          # target directory the CLI chose.
          $exe = Get-ChildItem -Path "desktop/src-tauri/target" -Recurse -File `
            -Filter "agenthub*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no desktop executable under desktop/src-tauri/target" }
          Compress-Archive -Path $exe.FullName `
            -DestinationPath "$out/agenthub-$env:VERSION-windows-${{ matrix.arch }}.zip"
          Get-ChildItem $out

      - name: Write the checksums (Linux, macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ROOT="${GITHUB_WORKSPACE}/desktop/src-tauri/target"
          OUT="${GITHUB_WORKSPACE}/desktop-artifacts"
          # macOS ships shasum, Linux sha256sum; both print "<hash>  <file>".
          sum() {
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$1" && sha256sum "$2")
            else
              (cd "$1" && shasum -a 256 "$2")
            fi
          }
          # The installers keep the name tauri-action attached them under, so the
          # sums in this file match the assets already on the release. They are
          # found by name rather than by a guessed bundle directory.
          : > "$OUT/SHA256SUMS.txt"
          find "$TARGET_ROOT" -path '*/bundle/*' -type f \
              \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print \
            | sort | while read -r file; do
                sum "$(dirname "$file")" "$(basename "$file")" >> "$OUT/SHA256SUMS.txt"
              done
          if [ ! -s "$OUT/SHA256SUMS.txt" ]; then
            echo "::error::no installer to checksum under $TARGET_ROOT" >&2
            exit 1
          fi
          (cd "$OUT" && sum "$OUT" agenthub-*.tar.gz >> SHA256SUMS.txt)
          cat "$OUT/SHA256SUMS.txt"

      - name: Write the checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/desktop-artifacts"
          $lines = @()
          foreach ($file in Get-ChildItem -Path "desktop/src-tauri/target" -Recurse -File -Include *.msi) {
            $lines += "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          foreach ($file in Get-ChildItem -Path $out -File -Filter *.zip) {
            $lines += "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          if ($lines.Count -eq 0) { throw "nothing to checksum" }
          Set-Content -Path "$out/SHA256SUMS.txt" -Value $lines -Encoding utf8
          Get-Content "$out/SHA256SUMS.txt"

      - name: Attach the archive and the checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          # The release that triggered this run; no new release, no body edit.
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            desktop-artifacts/*
          fail_on_unmatched_files: true
