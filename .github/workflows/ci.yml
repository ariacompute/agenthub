# agenthub — continuous integration.
#
# Four jobs, mirroring the documented test targets:
#   • go     → `go test -race ./...` under the repo root. Unit cases run
#              offline; the store/hub integration cases skip themselves when
#              DATABASE_URL is unset, so a Postgres service is provided to let
#              them exercise the real GORM path, and the variable is asserted
#              before the suite runs: a run whose DB-backed cases all skip is
#              green while measuring nothing, and the coverage number then
#              describes the offline subset. `go vet ./...` runs alongside as a
#              fast static gate, and `make test-cover` reports the DB-backed
#              coverage (it refuses to measure without the variable).
#   • go-restricted → the same suite as the role a deployment actually uses.
#              `go` runs everything as the Postgres superuser, which bypasses
#              every policy and can create anything, so a case that needs DDL and
#              a case that leaks across owners both pass there. This job migrates
#              as scripts/provision-db-roles.sql's migrator, applies that file's
#              grants, and then runs the suite as `agenthub_app`: DML only, no
#              BYPASSRLS. Cases that genuinely need to build a table skip with a
#              reason instead of failing with "permission denied".
#   • web     → `bunx vitest run` under web/ (the console's Vitest suite:
#              monochrome guard, 13-language copy completeness, smoke).
#   • e2e     → the assembled product: real Postgres, real binary, built console,
#              then `make e2e-coverage` (every documented route has a case),
#              `make e2e-api` and `make e2e-ui`. Failure reports are archived.
#
# The console is built and served from backend/static at runtime; CI does not
# need to build it to run the web unit tests, so only the test runner is set up.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One CI run per ref; a newer push cancels an in-progress one so results are
# never a mix of two commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  # ------------------------------------------------------------ go (test + vet)
  go:
    name: go — test -race
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agenthub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # Lets the store/hub integration cases run against a real Postgres instead
      # of self-skipping. The server runs its own idempotent Migrate on Open.
      DATABASE_URL: postgres://agenthub:agenthub@localhost:5432/agenthub?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      # The gate itself. Every DB-backed case self-skips without this variable,
      # so a run that lacks it is green while measuring nothing; failing here
      # names the missing configuration instead. internal/testdb also asserts the
      # same rule from inside the suite (TestDatabaseURLIsSetInCI), which
      # covers CI systems that do not read this file.
      - name: DATABASE_URL is required
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL must be set: without it internal/store, internal/backup and tests/ skip and the coverage number describes the offline subset."
            exit 1
          fi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Vet
        run: go vet ./...

      # The service starts empty on every run, and `go test ./...` builds and
      # runs packages in parallel: internal/backup dumps whatever catalogue it
      # finds, so on a fresh database it can query before the first migrator has
      # created a table and fail with "no application tables found" (its tests
      # would then be red on a schedule, not on a commit). internal/store owns
      # the migrations and its DB cases call Migrate on Open, so they run once on
      # their own to provision the schema. `-count=1` because a cached test result
      # would skip the migration and provision nothing.
      - name: Migrate (schema before the parallel run)
        run: go test -race -count=1 -p 1 ./internal/store/

      - name: Test (race)
        run: go test -race ./...

      # The number the completeness report is read from has to be the DB-backed
      # one. `make test-cover` refuses to print anything without DATABASE_URL
      # (set at job level), so this step doubles as the check that the variable
      # above was not dropped.
      - name: Coverage (with the database)
        run: make test-cover

      # Uploaded even on success: the report is written by reading job output
      # and artifacts from the outside, and a profile that exists only in a log
      # cannot be re-derived per package.
      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------- go (production runtime shape)
  go-restricted:
    name: go — restricted runtime role
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agenthub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SUPER_URL: postgres://agenthub:agenthub@localhost:5432/agenthub?sslmode=disable
      # The migrator owns the schema; the migrator password is fixed here because
      # the roles are created before scripts/provision-db-roles.sql runs (that
      # file's CREATE ROLE statements are skipped once the roles exist).
      MIGRATOR_URL: postgres://agenthub_migrator:ci_migrator@localhost:5432/agenthub?sslmode=disable
      # The whole point of this job: the suite runs as the role production uses.
      DATABASE_URL: postgres://agenthub_app:ci_app@localhost:5432/agenthub?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      # Same gate as the go job: this one runs as the runtime role, so a missing
      # DATABASE_URL would skip every policy-bound case and prove nothing about
      # the deployment shape the job exists for.
      - name: DATABASE_URL is required
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL must be set: this job exists to run the suite as the runtime role."
            exit 1
          fi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # Roles first, with known passwords: provision-db-roles.sql only creates a
      # role that is missing, so running it afterwards keeps these credentials and
      # still applies every GRANT and its "RLS is enforced on all of these" check.
      - name: Create the roles
        run: |
          psql "$SUPER_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'agenthub_migrator') THEN
              CREATE ROLE agenthub_migrator LOGIN PASSWORD 'ci_migrator';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'agenthub_app') THEN
              CREATE ROLE agenthub_app LOGIN PASSWORD 'ci_app';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE agenthub TO agenthub_migrator, agenthub_app;
          GRANT USAGE, CREATE ON SCHEMA public TO agenthub_migrator;
          SQL

      # internal/store owns the migrations and its DB cases call Migrate, so this
      # provisions the schema as the role that is allowed to.
      - name: Migrate as the migrator
        env:
          DATABASE_URL: ${{ env.MIGRATOR_URL }}
        run: go test -count=1 -p 1 ./internal/store/

      - name: Provision (grants + the RLS assertion)
        run: psql "$SUPER_URL" -v ON_ERROR_STOP=1 -f scripts/provision-db-roles.sql

      # Everything below runs as agenthub_app: DML only, no CREATE, not
      # BYPASSRLS. Cases that need to build a probe table skip with a reason.
      - name: Test as the runtime role
        run: go test -race -count=1 ./...

  # -------------------------------------------------------------- web (vitest)
  web:
    name: web — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install

      - name: Vitest (run)
        run: bunx vitest run

  # ------------------------------------------------ e2e (a real server, twice)
  #
  # The unit suites prove the parts; this job proves the assembled product: a real
  # Postgres, a real binary, the built console, and both user-facing suites from
  # e2e/. The API suite is a declarative table over every documented route, and
  # `e2e-coverage` fails the job when a route in docs/*.md has no case — that is
  # the regression the job exists for, so it runs before the suite that needs a
  # server. Docker is available on the runner, so the sandbox cases run for real
  # instead of skipping.
  e2e:
    name: e2e — api + ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agenthub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://agenthub:agenthub@localhost:5432/agenthub?sslmode=disable
      AGENTHUB_ENV: dev
      AGENTHUB_HTTP_PORT: "3500"
      AGENTHUB_STATIC_DIR: ./backend/static
      AGENTHUB_SEED_DEMO: "true"
      # The credentials the suites sign in with (e2e/e2e.config.js defaults).
      AGENTHUB_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: agenthub-admin-pass
      # Without a files backend every /api/files* route answers files_disabled,
      # which would turn five documented endpoints into permanent SKIPs.
      AGENTHUB_FILES_STORE: local
      AGENTHUB_FILES_DIR: ./.e2e-files
      # A missing case for a documented route fails the run instead of warning.
      AGENTHUB_E2E_STRICT_COVERAGE: "1"
      # The runner has Docker, so the one command-execution case runs for real.
      AGENTHUB_E2E_SANDBOX_EXEC: "1"
      AGENTHUB_E2E_LANG: en
      BASE_URL: http://127.0.0.1:3500
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # The UI journeys drive the real console, so it has to be built: `make build`
      # runs web-install + vite build into backend/static and then the Go binary.
      - name: Build console and server
        run: make build

      - name: Install e2e dependencies
        working-directory: e2e
        run: bun install

      - name: Install Chromium
        working-directory: e2e
        run: bun x playwright install --with-deps chromium

      # The default sandbox image: a first lease otherwise spends its budget on a
      # pull and the case fails on a timeout rather than on a defect.
      - name: Pre-pull the sandbox image
        run: docker pull debian:bookworm-slim

      # The static guard needs no server, and it is the cheapest thing to fail on.
      - name: Route coverage guard
        run: make e2e-coverage

      - name: Start the server
        run: |
          set -euo pipefail
          mkdir -p .e2e-files
          ./bin/agenthub-server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${AGENTHUB_HTTP_PORT}/healthz" > /dev/null; then
              echo "server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 60s" >&2
          cat server.log >&2
          exit 1

      - name: API suite
        run: make e2e-api

      - name: UI suite
        run: make e2e-ui

      - name: Stop the server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi

      - name: Server log
        if: failure()
        run: cat server.log || true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            e2e/reports/
            e2e/playwright-report/
            server.log
          if-no-files-found: warn
          retention-days: 7
