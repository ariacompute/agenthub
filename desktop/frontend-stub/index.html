<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agenthub</title>
    <style>
      /* What the window shows before the loopback proxy has taken over, which
         in practice is a few frames. Same grey scale as the console, and no
         hue anywhere. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #050505;
        color: rgba(255, 255, 255, 0.44);
        font: 13px/1.5 system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.5);
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5.6v2.6M12 15.8v2.6M5.6 12h2.6M15.8 12h2.6" />
        <circle cx="12" cy="12" r="3.1" fill="currentColor" stroke="none" />
        <circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none" />
        <circle cx="20" cy="12" r="1.6" fill="currentColor" stroke="none" />
        <circle cx="12" cy="20" r="1.6" fill="currentColor" stroke="none" />
        <circle cx="4" cy="12" r="1.6" fill="currentColor" stroke="none" />
      </svg>
    </div>
  </body>
</html>
