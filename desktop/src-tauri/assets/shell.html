<!doctype html>
<!--
  The two screens the desktop shell owns: the connection page and the about
  page. Both are served by the loopback proxy from /__shell/*, both are single
  files, and every string comes from the boot object the Rust side injects —
  so the page has no translations of its own to drift.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agenthub</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #111111;
        --raise: #161616;
        --line: #262626;
        --line-strong: #3a3a3a;
        --ink: #f5f5f5;
        --ink-soft: #8c8c8c;
        --ink-faint: #5c5c5c;
        --sheen: #ffffff;
        --on-sheen: #0a0a0a;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --panel: #ffffff;
          --raise: #f2f2f2;
          --line: #e5e5e5;
          --line-strong: #cfcfcf;
          --ink: #161616;
          --ink-soft: #5c5c5c;
          --ink-faint: #8c8c8c;
          --sheen: #161616;
          --on-sheen: #ffffff;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: 100%;
        max-width: 460px;
        animation: rise 260ms ease-out both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wrap {
          animation: none;
        }
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        text-align: center;
      }
      /* The same badge the console draws at the top of its sidebar: a 30px tile
         with the sheen wash, a hairline border and the hub glyph at 18px.
         Colors track the theme the way --sheen / --text-1 do there. */
      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.12);
        color: var(--ink);
      }
      @media (prefers-color-scheme: light) {
        .brand-mark {
          background: linear-gradient(135deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.02));
          border-color: rgba(0, 0, 0, 0.34);
          box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.06);
        }
      }
      .brand-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .brand-sub {
        margin: 0;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
      }
      .field {
        display: block;
        margin-bottom: 18px;
      }
      .field:last-of-type {
        margin-bottom: 0;
      }
      .label {
        display: block;
        margin-bottom: 7px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .input {
        width: 100%;
        padding: 10px 12px;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink);
        background: var(--raise);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        outline: none;
        transition: border-color 140ms ease;
      }
      select.input {
        font-family: inherit;
      }
      .input::placeholder {
        color: var(--ink-faint);
      }
      .input:hover {
        border-color: var(--ink-faint);
      }
      .input:focus-visible {
        border-color: var(--ink);
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 18px;
        cursor: pointer;
      }
      .check input {
        margin: 2px 0 0;
        inline-size: 15px;
        block-size: 15px;
        accent-color: var(--sheen);
        cursor: pointer;
      }
      .check-text {
        font-size: 13px;
      }
      .note {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        font-style: normal;
        color: var(--ink-faint);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        flex: 1;
        min-height: 38px;
        padding: 9px 16px;
        font: inherit;
        font-weight: 500;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, opacity 140ms ease;
      }
      .btn:hover {
        background: var(--raise);
      }
      .btn:active {
        background: var(--line);
      }
      .btn:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .btn.primary {
        color: var(--on-sheen);
        background: var(--sheen);
        border-color: var(--sheen);
      }
      .btn.primary:hover {
        opacity: 0.88;
        background: var(--sheen);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 16px 0 0;
        min-height: 18px;
        font-size: 12px;
        color: var(--ink-soft);
      }
      .status[data-tone='bad'] {
        color: var(--ink);
      }
      .status svg {
        flex: none;
        margin-top: 2px;
      }
      .rows {
        margin: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row dt {
        color: var(--ink-soft);
      }
      .row dd {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M12 5.6v2.6M12 15.8v2.6M5.6 12h2.6M15.8 12h2.6" />
            <circle cx="12" cy="12" r="3.1" fill="currentColor" stroke="none" />
            <circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none" />
            <circle cx="20" cy="12" r="1.6" fill="currentColor" stroke="none" />
            <circle cx="12" cy="20" r="1.6" fill="currentColor" stroke="none" />
            <circle cx="4" cy="12" r="1.6" fill="currentColor" stroke="none" />
          </svg>
        </div>
        <div class="brand-name">agenthub</div>
        <p class="brand-sub" id="subtitle"></p>
      </header>

      <section class="card" id="form-card">
        <label class="field">
          <span class="label" id="label-server"></span>
          <input
            id="server"
            class="input"
            type="text"
            inputmode="url"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            placeholder="https://agenthub.example.com"
            aria-describedby="status"
          />
        </label>

        <label class="check">
          <input id="insecure" type="checkbox" />
          <span class="check-text">
            <span id="label-insecure"></span>
            <em class="note" id="note-insecure"></em>
          </span>
        </label>

        <label class="field">
          <span class="label" id="label-language"></span>
          <select id="language" class="input"></select>
        </label>

        <div class="actions">
          <button class="btn primary" id="connect" type="button"></button>
          <button class="btn" id="later" type="button" hidden></button>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card" id="about-card" hidden>
        <dl class="rows">
          <div class="row"><dt id="label-version"></dt><dd id="value-version"></dd></div>
          <div class="row"><dt id="label-build"></dt><dd id="value-build"></dd></div>
          <div class="row"><dt id="label-server-about"></dt><dd id="value-server"></dd></div>
        </dl>
        <div class="actions">
          <button class="btn primary" id="back" type="button"></button>
        </div>
      </section>
    </main>

    <script>
      /*__SHELL_BOOT__*/
    </script>
    <script>
      const boot = window.__SHELL__ || { page: 'connect', lang: 'en', tables: {}, languages: [] }
      let lang = boot.lang || 'en'

      const el = (id) => document.getElementById(id)
      const t = (key) => (boot.tables[lang] && boot.tables[lang][key]) || boot.tables.en[key] || ''

      function applyLanguage() {
        document.documentElement.lang = lang
        document.documentElement.dir = boot.dirs[lang] || 'ltr'
        el('label-server').textContent = t('fieldServer')
        el('label-insecure').textContent = t('fieldInsecure')
        el('note-insecure').textContent = t('fieldInsecureNote')
        el('label-language').textContent = t('fieldLanguage')
        el('label-version').textContent = t('aboutVersion')
        el('label-build').textContent = t('aboutBuild')
        el('label-server-about').textContent = t('aboutServer')
        el('back').textContent = t('trayOpen')
        el('later').textContent = t('actionLater')
        setButton(t('actionConnect'))
      }

      function setButton(text) {
        if (!busy) el('connect').textContent = text
      }

      let busy = false

      function setStatus(message, tone) {
        const status = el('status')
        status.textContent = message || ''
        status.dataset.tone = tone || ''
      }

      function lock(on) {
        busy = on
        el('connect').disabled = on
        el('connect').textContent = on ? t('actionConnecting') : t('actionConnect')
      }

      function localReason(raw) {
        const value = raw.trim()
        if (!value) return t('errEmpty')
        if (!/^https?:\/\/\S+$/i.test(value)) return t('errInvalid')
        return ''
      }

      async function post(path, payload) {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload || {}),
        })
        return res.json().catch(() => ({ ok: false, reason: 'unexpected' }))
      }

      const REASONS = {
        certificate: 'errCertificate',
        unreachable: 'errUnreachable',
        timeout: 'errUnreachable',
        invalid: 'errInvalid',
        empty: 'errEmpty',
      }

      async function connect() {
        if (busy) return
        const raw = el('server').value
        const reason = localReason(raw)
        if (reason) {
          setStatus(reason, 'bad')
          el('server').focus()
          return
        }
        lock(true)
        setStatus(t('statusChecking'), '')
        const probe = await post('/__shell/test', {
          server_url: raw,
          accept_invalid_certs: el('insecure').checked,
        })
        if (!probe.ok) {
          lock(false)
          const key = REASONS[probe.reason] || 'errUnexpected'
          setStatus(t(key), 'bad')
          return
        }
        await post('/__shell/config', {
          server_url: raw,
          accept_invalid_certs: el('insecure').checked,
          lang: lang,
        })
        setStatus(t('statusConnected'), '')
        window.location.href = '/'
      }

      function render() {
        applyLanguage()
        if (boot.page === 'about') {
          el('form-card').hidden = true
          el('about-card').hidden = false
          el('subtitle').textContent = t('trayAbout')
          el('value-version').textContent = boot.version
          el('value-build').textContent = boot.commit
          el('value-server').textContent = boot.serverUrl || '—'
          el('back').onclick = () => {
            window.location.href = '/'
          }
          return
        }
        el('subtitle').textContent = t('connectSubtitle')
        el('server').value = boot.serverUrl || ''
        el('insecure').checked = !!boot.insecure
        el('later').hidden = !!boot.configured
        el('later').onclick = () => post('/__shell/hide')
        el('connect').onclick = connect
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && event.target === el('server')) connect()
          if (event.key === 'Escape') window.location.href = '/'
        })
      }

      const select = el('language')
      for (const [code, name] of boot.languages) {
        const option = document.createElement('option')
        option.value = code
        option.textContent = name
        select.appendChild(option)
      }
      select.value = lang
      select.onchange = () => {
        lang = select.value
        applyLanguage()
        setStatus('', '')
      }

      render()
    </script>
  </body>
</html>
