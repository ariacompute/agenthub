services:
  # PostgreSQL is the only stateful component of agenthub: resources, tasks,
  # artifacts, spans, events and push callback records all live here.
  # Host port 5434 avoids the ports taken by postgres (5432) and bankmind (5433).
  postgres:
    image: postgres:16-alpine
    container_name: agenthub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
      POSTGRES_USER: ${POSTGRES_USER:-agenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenthub}
    # Listen on POSTGRES_PORT (default 5434) on every attached network and
    # publish the same port to the host, so `postgres:<port>` (compose) and
    # `localhost:<port>` (make run) both resolve. POSTGRES_PORT moves both ends
    # together. The host-side publication needs the `hostpg` network below.
    command: ["postgres", "-p", "${POSTGRES_PORT:-5434}"]
    ports:
      - "${POSTGRES_PORT:-5434}:${POSTGRES_PORT:-5434}"
    volumes:
      - agenthub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenthub} -d ${POSTGRES_DB:-agenthub} -p ${POSTGRES_PORT:-5434}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Hardening. `cap_drop: [ALL]` is deliberately *not* applied here: the
    # official image starts as root and drops to `postgres` through setuid/setgid,
    # which needs those capabilities during init. Everything that would let a
    # compromised database process touch the host is dropped instead, and the
    # container never gains a privilege it did not start with.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_PTRACE
      - SYS_TIME
    pids_limit: 512
    mem_limit: 2g
    # The database is reachable only from the application network: nothing on
    # the console side (not even the vite dev server) can open a connection.
    # `hostpg` carries no other service: Docker skips host-port publication for
    # a container attached only to an `internal` network, so `make run`'s
    # localhost DSN needs one non-internal endpoint. See the network definition
    # at the bottom of this file.
    networks:
      - data
      - hostpg
    restart: unless-stopped

  # Single binary: A2A data plane (/.well-known/agent.json, POST /a2a),
  # control plane (/api/*), /healthz and the built Vue 3 console.
  agenthub:
    build:
      context: .
      dockerfile: Dockerfile
      # No `network: host` here on purpose: recent Docker refuses it unless the
      # caller passes `--allow=network.host`, which would break a plain
      # `docker compose build`. On the bridge network a host-side BUILD_PROXY
      # (127.0.0.1) is unreachable, so the Dockerfile retries bun install and
      # `go mod download` with the proxy variables cleared and falls back to the
      # direct GOPROXY mirror. For a build that really needs the host proxy use
      # `make docker-build` (it passes --network=host on the command line).
      args:
        # Outbound proxy for the build. Empty => direct internet connection.
        #   export BUILD_PROXY=http://127.0.0.1:7897   # e.g. Clash
        BUILD_PROXY: ${BUILD_PROXY:-}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        # Mirror root for the runtime stage's apk add. Empty => the Alpine CDN.
        #   export ALPINE_MIRROR=https://mirrors.aliyun.com   # if the CDN stalls
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org}
        # Reported as "version@commit" in the console and /healthz. Stamp with
        #   VERSION=$(git describe --tags --abbrev=0 --always) \
        #   COMMIT=$(git rev-parse --short=7 HEAD) docker compose build
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DISTANCE: ${DISTANCE:-0}
        DIRTY: ${DIRTY:-false}
    container_name: agenthub-server
    environment:
      AGENTHUB_HTTP_PORT: "3500"
      AGENTHUB_ENV: ${AGENTHUB_ENV:-dev}
      AGENTHUB_STATIC_DIR: ${AGENTHUB_STATIC_DIR:-./backend/static}
      # DATABASE_URL is interpolated from the environment so a deployment can
      # override the connection. The default keeps the bundled postgres usable for
      # local/dev. When you override it, the password must match POSTGRES_PASSWORD
      # below. The separate DDL role (AGENTHUB_MIGRATE_DATABASE_URL) is a secret
      # and therefore travels only through env_file below.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-agenthub}:${POSTGRES_PASSWORD:-agenthub}@postgres:${POSTGRES_PORT:-5434}/${POSTGRES_DB:-agenthub}}
      # Identities live in Postgres. The bootstrap administrator is upserted at
      # every boot; without it the first registered account becomes the owner.
      AGENTHUB_BOOTSTRAP_ADMIN_EMAIL: ${AGENTHUB_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: ${AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD:-change-me-please}
      AGENTHUB_BOOTSTRAP_ADMIN_NAME: ${AGENTHUB_BOOTSTRAP_ADMIN_NAME:-Administrator}
      AGENTHUB_SESSION_TTL: ${AGENTHUB_SESSION_TTL:-12h}
      AGENTHUB_COOKIE_SECURE: ${AGENTHUB_COOKIE_SECURE:-false}
      AGENTHUB_PUBLIC_BASE_URL: ${AGENTHUB_PUBLIC_BASE_URL:-}
      AGENTHUB_OAUTH_ENABLED: ${AGENTHUB_OAUTH_ENABLED:-false}
      AGENTHUB_OAUTH_GOOGLE_CLIENT_ID: ${AGENTHUB_OAUTH_GOOGLE_CLIENT_ID:-}
      AGENTHUB_OAUTH_GOOGLE_CLIENT_SECRET: ${AGENTHUB_OAUTH_GOOGLE_CLIENT_SECRET:-}
      AGENTHUB_OAUTH_GOOGLE_SCOPES: ${AGENTHUB_OAUTH_GOOGLE_SCOPES:-}
      AGENTHUB_OAUTH_GITHUB_CLIENT_ID: ${AGENTHUB_OAUTH_GITHUB_CLIENT_ID:-}
      AGENTHUB_OAUTH_GITHUB_CLIENT_SECRET: ${AGENTHUB_OAUTH_GITHUB_CLIENT_SECRET:-}
      AGENTHUB_OAUTH_GITHUB_SCOPES: ${AGENTHUB_OAUTH_GITHUB_SCOPES:-}
      AGENTHUB_OAUTH_WECHAT_APP_ID: ${AGENTHUB_OAUTH_WECHAT_APP_ID:-}
      AGENTHUB_OAUTH_WECHAT_APP_SECRET: ${AGENTHUB_OAUTH_WECHAT_APP_SECRET:-}
      AGENTHUB_OAUTH_OIDC_CLIENT_ID: ${AGENTHUB_OAUTH_OIDC_CLIENT_ID:-}
      AGENTHUB_OAUTH_OIDC_CLIENT_SECRET: ${AGENTHUB_OAUTH_OIDC_CLIENT_SECRET:-}
      AGENTHUB_OAUTH_OIDC_ISSUER: ${AGENTHUB_OAUTH_OIDC_ISSUER:-}
      AGENTHUB_OAUTH_OIDC_SCOPES: ${AGENTHUB_OAUTH_OIDC_SCOPES:-}
      # Demo resources are opt-in: a default instance starts with an empty
      # registry. Enable for a walkthrough or before make e2e-api.
      AGENTHUB_SEED_DEMO: ${AGENTHUB_SEED_DEMO:-false}
      AGENTHUB_A2A_LEGACY_METHODS: ${AGENTHUB_A2A_LEGACY_METHODS:-true}
      AGENTHUB_MAX_PARALLEL: ${AGENTHUB_MAX_PARALLEL:-8}
      AGENTHUB_CLI_TIMEOUT: ${AGENTHUB_CLI_TIMEOUT:-15s}
      AGENTHUB_CLI_ALLOWLIST: ${AGENTHUB_CLI_ALLOWLIST:-git,ls,cat,echo,date,aria-memo}
      AGENTHUB_AGENT_TIMEOUT: ${AGENTHUB_AGENT_TIMEOUT:-120s}
      AGENTHUB_MAX_OUTPUT_BYTES: ${AGENTHUB_MAX_OUTPUT_BYTES:-65536}
      AGENTHUB_EVENT_BUFFER: ${AGENTHUB_EVENT_BUFFER:-512}
      AGENTHUB_MODEL_ROUTER_MODE: ${AGENTHUB_MODEL_ROUTER_MODE:-mock}
      AGENTHUB_PUSH_ENABLED: ${AGENTHUB_PUSH_ENABLED:-true}
      AGENTHUB_PUSH_RECORD_LIMIT: ${AGENTHUB_PUSH_RECORD_LIMIT:-100}
      # Optional modules. Listing them here (not only in env_file) means a
      # switch can also be flipped from the shell, e.g.
      #   AGENTHUB_CHANNELS_ENABLED=true make up
      # Defaults mirror internal/config.Load so an unset key behaves identically
      # whether it arrives by substitution or by env_file.
      AGENTHUB_CHANNELS_ENABLED: ${AGENTHUB_CHANNELS_ENABLED:-false}
      AGENTHUB_SPEECH_MODE: ${AGENTHUB_SPEECH_MODE:-mock}
      AGENTHUB_AUDIO_MAX_BYTES: ${AGENTHUB_AUDIO_MAX_BYTES:-16777216}
      AGENTHUB_REGISTRY_SYNC_ENABLED: ${AGENTHUB_REGISTRY_SYNC_ENABLED:-false}
      AGENTHUB_REGISTRY_SYNC_INTERVAL: ${AGENTHUB_REGISTRY_SYNC_INTERVAL:-1h}
      AGENTHUB_REGISTRY_SYNC_FIXTURE: ${AGENTHUB_REGISTRY_SYNC_FIXTURE:-true}
      AGENTHUB_FILES_STORE: ${AGENTHUB_FILES_STORE:-off}
      AGENTHUB_FILES_MAX_BYTES: ${AGENTHUB_FILES_MAX_BYTES:-33554432}
      AGENTHUB_FILES_DIR: ${AGENTHUB_FILES_DIR:-}
      AGENTHUB_FILES_S3_ENDPOINT: ${AGENTHUB_FILES_S3_ENDPOINT:-}
      AGENTHUB_FILES_S3_BUCKET: ${AGENTHUB_FILES_S3_BUCKET:-}
      AGENTHUB_FILES_S3_REGION: ${AGENTHUB_FILES_S3_REGION:-us-east-1}
      AGENTHUB_FILES_S3_PATH_STYLE: ${AGENTHUB_FILES_S3_PATH_STYLE:-true}
      # The *_ENV values name credential variables; the credentials themselves
      # are injected by env_file and must never be inlined here.
      AGENTHUB_FILES_S3_ACCESS_KEY_ENV: ${AGENTHUB_FILES_S3_ACCESS_KEY_ENV:-AGENTHUB_FILES_S3_ACCESS_KEY}
      AGENTHUB_FILES_S3_SECRET_KEY_ENV: ${AGENTHUB_FILES_S3_SECRET_KEY_ENV:-AGENTHUB_FILES_S3_SECRET_KEY}
      # Database checkpoints. The volume below is mounted either way;
      # AGENTHUB_BACKUP_DIR stays empty by default so an instance takes no
      # checkpoints until somebody switches the feature on. MODE is the
      # schedule (off | interval | daily | cron), not the on/off switch.
      AGENTHUB_BACKUP_DIR: ${AGENTHUB_BACKUP_DIR:-}
      AGENTHUB_BACKUP_MODE: ${AGENTHUB_BACKUP_MODE:-off}
      AGENTHUB_BACKUP_INTERVAL: ${AGENTHUB_BACKUP_INTERVAL:-24h}
      AGENTHUB_BACKUP_DAILY_TIME: ${AGENTHUB_BACKUP_DAILY_TIME:-03:00}
      AGENTHUB_BACKUP_TIMEZONE: ${AGENTHUB_BACKUP_TIMEZONE:-UTC}
      AGENTHUB_BACKUP_CRON: ${AGENTHUB_BACKUP_CRON:-}
      AGENTHUB_BACKUP_KEEP_LAST: ${AGENTHUB_BACKUP_KEEP_LAST:-7}
      AGENTHUB_BACKUP_MAX_AGE_DAYS: ${AGENTHUB_BACKUP_MAX_AGE_DAYS:-30}
      # Router / scheduler: off until enabled. ROUTER_RESOURCE names the
      # fallback worker; without one, tickets can answer router_resource_unset.
      AGENTHUB_ROUTER_ENABLED: ${AGENTHUB_ROUTER_ENABLED:-false}
      AGENTHUB_ROUTER_INTERVAL: ${AGENTHUB_ROUTER_INTERVAL:-2s}
      AGENTHUB_ROUTER_BATCH_MAX: ${AGENTHUB_ROUTER_BATCH_MAX:-20}
      AGENTHUB_ROUTER_MAX_TICKETS: ${AGENTHUB_ROUTER_MAX_TICKETS:-8}
      AGENTHUB_ROUTER_MAX_ATTEMPTS: ${AGENTHUB_ROUTER_MAX_ATTEMPTS:-3}
      AGENTHUB_ROUTER_ASSESS_MODE: ${AGENTHUB_ROUTER_ASSESS_MODE:-rule}
      AGENTHUB_ROUTER_ASSESS_RESOURCE: ${AGENTHUB_ROUTER_ASSESS_RESOURCE:-}
      AGENTHUB_ROUTER_RESOURCE: ${AGENTHUB_ROUTER_RESOURCE:-}
      AGENTHUB_ROUTER_TRIGGER_TTL: ${AGENTHUB_ROUTER_TRIGGER_TTL:-168h}
      AGENTHUB_ROUTER_PRUNE_INTERVAL: ${AGENTHUB_ROUTER_PRUNE_INTERVAL:-10m}
      # Execution sandboxes. AGENTHUB_SANDBOX_PROVIDERS is a JSON array and is
      # deliberately left to env_file: interpolating JSON into YAML is unsafe.
      AGENTHUB_SANDBOX_ENABLED: ${AGENTHUB_SANDBOX_ENABLED:-true}
      AGENTHUB_SANDBOX_PROVIDER: ${AGENTHUB_SANDBOX_PROVIDER:-docker}
      AGENTHUB_SANDBOX_DEFAULT_IMAGE: ${AGENTHUB_SANDBOX_DEFAULT_IMAGE:-debian:bookworm-slim}
      AGENTHUB_SANDBOX_DOCKER_HOST: ${AGENTHUB_SANDBOX_DOCKER_HOST:-}
      AGENTHUB_SANDBOX_RUNTIME: ${AGENTHUB_SANDBOX_RUNTIME:-}
      AGENTHUB_SANDBOX_IDLE_TTL: ${AGENTHUB_SANDBOX_IDLE_TTL:-30m}
      AGENTHUB_SANDBOX_MAX_TTL: ${AGENTHUB_SANDBOX_MAX_TTL:-2h}
      AGENTHUB_SANDBOX_MAX_PER_OWNER: ${AGENTHUB_SANDBOX_MAX_PER_OWNER:-4}
      AGENTHUB_SANDBOX_MAX_TOTAL: ${AGENTHUB_SANDBOX_MAX_TOTAL:-16}
      AGENTHUB_SANDBOX_EGRESS_ALLOWLIST: ${AGENTHUB_SANDBOX_EGRESS_ALLOWLIST:-}
      AGENTHUB_SANDBOX_NODE_POLL_TIMEOUT: ${AGENTHUB_SANDBOX_NODE_POLL_TIMEOUT:-25s}
      AGENTHUB_SANDBOX_SWEEP_INTERVAL: ${AGENTHUB_SANDBOX_SWEEP_INTERVAL:-30s}
      # Row level security. `enforce` is the default and the only value a
      # production deployment should run: `off` makes every isolation policy a
      # no-op and is refused with AGENTHUB_ENV=prod unless AGENTHUB_RLS_ACK=1
      # also says the operator meant it.
      AGENTHUB_RLS: ${AGENTHUB_RLS:-enforce}
      AGENTHUB_RLS_ACK: ${AGENTHUB_RLS_ACK:-false}
      AGENTHUB_DB_MAX_OPEN_CONNS: ${AGENTHUB_DB_MAX_OPEN_CONNS:-25}
      AGENTHUB_DB_MAX_IDLE_CONNS: ${AGENTHUB_DB_MAX_IDLE_CONNS:-10}
      AGENTHUB_DB_CONN_MAX_LIFETIME: ${AGENTHUB_DB_CONN_MAX_LIFETIME:-30m}
      # API audit trail: on by default, one append-only row per /api and /a2a
      # call, hash-chained. Retention is how long a row may live before the
      # cleanup tick removes it (and records that it did).
      AGENTHUB_AUDIT_ENABLED: ${AGENTHUB_AUDIT_ENABLED:-true}
      AGENTHUB_AUDIT_RETENTION: ${AGENTHUB_AUDIT_RETENTION:-2160h}
      AGENTHUB_AUDIT_QUEUE: ${AGENTHUB_AUDIT_QUEUE:-8192}
      AGENTHUB_AUDIT_BATCH: ${AGENTHUB_AUDIT_BATCH:-64}
    # Pass the operator's .env (or .env.sec copied to .env) into the container.
    # A root-level .env is only used by Compose for variable *substitution*; it is
    # NOT injected as container env unless we do it here. Keys deliberately left
    # out of the block above are secrets (AGENTHUB_ENCRYPTION_KEY,
    # AGENTHUB_PUSH_SECRET, AGENTHUB_MIGRATE_DATABASE_URL, S3 credentials) and
    # AGENTHUB_SANDBOX_PROVIDERS (JSON); env_file injects them verbatim without
    # YAML interpolation.
    env_file:
      - .env
    ports:
      - "${AGENTHUB_HTTP_PORT:-3500}:3500"
    # Migrations run at boot, so the database must be reachable first.
    volumes:
      # Checkpoint archives. A named volume, so rebuilding the container
      # keeps the archives it wrote.
      - agenthub-backups:/var/lib/agenthub/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3500/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    # Hardening: the binary needs no capability at all (it binds 3500 as an
    # unprivileged port), never escalates through a setuid helper, and has no
    # business mutating its own filesystem — the only writable places are the
    # backup volume and a scratch /tmp for pg_dump.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 1g
    # Two networks on purpose: `edge` carries the console, `data` reaches the
    # database. The dev console cannot see postgres, and a compromised frontend
    # container has nothing to connect to but the API it already had.
    networks:
      - edge
      - data
    restart: unless-stopped

  # Console dev server with hot reload. Optional: `docker compose --profile dev up`.
  web:
    image: oven/bun:1.4.4-alpine
    container_name: agenthub-web
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    environment:
      # vite.config.js proxies /api, /a2a and /healthz to this target.
      VITE_PROXY_TARGET: http://agenthub:3500
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
    depends_on:
      - agenthub
    profiles:
      - dev
    # A dev server is convention over configuration, so it runs as an ordinary
    # process with no capabilities and no path to the database.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    networks:
      - edge

volumes:
  agenthub-pgdata:
  agenthub-backups:

# Network split. `data` is internal (no route out at all), so the database
# cannot be reached from the console side or from the internet.
networks:
  edge: {}
  data:
    internal: true
  # Only postgres joins this network. Docker skips port publication for a
  # container whose every network is `internal`: PortBindings is recorded but
  # NetworkSettings.Ports stays null, so `ports: 5434:5434` becomes a no-op and
  # a host-run `make run` gets "connection refused" on localhost:5434. Keeping
  # the publication on a network no other service joins preserves the console
  # isolation; disabling masquerade keeps the database from gaining a route out.
  hostpg:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
